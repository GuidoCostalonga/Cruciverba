name: Pubblica la pagina

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.distribuzione.outputs.page_url }}
    steps:
      - name: Preleva il codice
        uses: actions/checkout@v4

      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Controlla l'archivio delle parole
        run: node controlla.js

      - name: Prepara il sito
        run: |
          mkdir -p sito
          cp index.html sito/index.html

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - name: Distribuisci
        id: distribuzione
        uses: actions/deploy-pages@v4
